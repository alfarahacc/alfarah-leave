<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>طلب إجازة - مجمع الفرح السكني</title>

</script>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root {
    --primary: #08576f;        /* أزرق مخضر (خلفية القائمة) */
    --primary-dark: #123f53;   /* أزرق داكن (رأس القائمة) */
    --accent: #046c86;         /* لون العنصر النشط */
    --cyan: #a5f3fc;           /* لون النص المميز */
    --sand: #eef5f7;
    --line: #c7dce3;
    --ink: #0e2f3c;
    --muted: #55737f;
    --gold: #d4b062;           /* ذهبي الشعار */
    --error: #b3261e;
    --card: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --primary: #08576f; --primary-dark: #123f53; --accent: #0a86a5; --cyan: #a5f3fc;
      --sand: #0a2531; --card: #0f3647; --line: #1f5266;
      --ink: #e6f4f8; --muted: #8fb7c4; --error: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: 'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif;
    background: var(--sand); color: var(--ink); line-height: 1.7;
    padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0);
  }
  header {
    background: linear-gradient(180deg, var(--primary-dark) 0%, var(--primary) 100%);
    color: #fff; padding: 24px 20px 58px;
    border-bottom: 4px solid var(--gold);
  }
  header .wrap { max-width: 620px; margin: 0 auto; display: flex; align-items: center; gap: 14px; }
  header .logo {
    height: 72px; width: auto; flex: 0 0 auto; object-fit: contain;
    background: transparent; border: 0; box-shadow: none; filter: none;
  }
  header h1 { margin: 0; font-size: 1.6rem; font-weight: 800; line-height: 1.3; }
  header p { margin: 2px 0 0; color: var(--cyan); opacity: .9; }
  main { max-width: 620px; margin: -38px auto 40px; padding: 0 16px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 22px 18px; box-shadow: 0 8px 28px rgba(8,87,111,.16);
  }
  .field { margin-bottom: 16px; }
  label { display: block; font-weight: 600; margin-bottom: 6px; }
  label .req { color: var(--error); }
  input, select, textarea {
    width: 100%; font: inherit; color: var(--ink); background: var(--card);
    border: 1.5px solid var(--line); border-radius: 10px; padding: 11px 12px;
  }
  input[readonly] { background: var(--sand); color: var(--muted); cursor: default; }
  textarea { min-height: 96px; resize: vertical; }
  input:focus, select:focus, textarea:focus, button:focus-visible {
    outline: 3px solid var(--gold); outline-offset: 1px; border-color: var(--accent);
  }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 480px) { .row { grid-template-columns: 1fr; gap: 0; } }
  .days {
    background: var(--sand); border: 1px dashed var(--line); border-radius: 10px;
    padding: 10px 12px; margin-bottom: 16px; color: var(--muted); min-height: 46px;
  }
  .days strong { color: var(--accent); font-size: 1.1rem; }
  @media (prefers-color-scheme: dark) { .days strong { color: var(--cyan); } }
  button.primary {
    width: 100%; font: inherit; font-weight: 800; font-size: 1.1rem; cursor: pointer;
    background: var(--accent); color: #fff; border: 0; border-radius: 10px; padding: 14px;
  }
  button.primary:hover { background: var(--primary); }
  button.primary:disabled { opacity: .6; cursor: wait; }
  .msg-error {
    display: none; background: rgba(179,38,30,.1); color: var(--error);
    border: 1px solid var(--error); border-radius: 10px; padding: 10px 12px; margin-bottom: 14px;
  }
  #done { display: none; text-align: center; padding: 18px 6px; }
  #done .tick {
    width: 64px; height: 64px; border-radius: 50%; background: var(--accent); color: #fff;
    display: inline-flex; align-items: center; justify-content: center; font-size: 2rem; margin-bottom: 10px;
  }
  #done h2 { margin: 6px 0; }
  #done .num { font-size: 1.5rem; font-weight: 800; color: var(--accent); }
  @media (prefers-color-scheme: dark) { #done .num { color: var(--cyan); } }
  .link-btn {
    margin-top: 14px; background: none; border: 1.5px solid var(--accent); color: var(--accent);
    font: inherit; font-weight: 600; padding: 10px 18px; border-radius: 10px; cursor: pointer;
  }
  @media (prefers-color-scheme: dark) { .link-btn { color: var(--cyan); border-color: var(--cyan); } }
  /* التاريخ: حقل كتابة dd/mm/yyyy ثابت الترتيب + زر تقويم أصلي شفاف فوق الأيقونة */
  @media (prefers-color-scheme: dark) { :root { color-scheme: dark; } }
  .dfield { position: relative; }
  .dfield .txt { direction: ltr; text-align: right; padding-left: 52px; font-variant-numeric: tabular-nums; }
  .dfield .cal {
    position: absolute; left: 5px; top: 50%; transform: translateY(-50%);
    width: 42px; height: 42px; display: flex; align-items: center; justify-content: center;
    color: var(--ink);
  }
  .dfield .cal svg { width: 22px; height: 22px; pointer-events: none; }
  .dfield .native {
    position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; padding: 0; border: 0;
    background: transparent; opacity: 0; cursor: pointer; font-size: 16px;
  }
  .dfield .native:focus { outline: none; }
  .dfield .native::-webkit-calendar-picker-indicator {
    position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer;
  }
</style>
</head>

      <h1>طلب إجازة</h1>
      <p>مجمع الفرح السكني</p>
    </div>

</header>

<main>
  <div class="card">
    <form id="form" novalidate onsubmit="return false;">
      <div class="msg-error" id="err" role="alert"></div>

      <div class="field">
        <label for="name">اسم الموظف <span class="req">*</span></label>
        <input id="name" type="text" list="namesList" autocomplete="off"
               placeholder="جارٍ تحميل الأسماء...">
        <datalist id="namesList"></datalist>
      </div>

      <div class="field">
        <label for="dept">القسم</label>
        <input id="dept" type="text" readonly placeholder="يظهر تلقائياً بعد اختيار الاسم">
      </div>

      <div class="bal-load" id="balLoad">جارٍ تحميل رصيدك...</div>
      <div class="bal" id="bal" aria-live="polite">
        <div class="b"><span>الرصيد السنوي</span><strong id="balTotal">—</strong></div>
        <div class="b"><span>المستهلك</span><strong id="balUsed">—</strong></div>
        <div class="b" id="balLeftBox"><span>المتبقي</span><strong id="balLeft">—</strong></div>
      </div>

      <div class="field">
        <label for="type">نوع الإجازة <span class="req">*</span></label>
        <select id="type">
          <option value="">اختر نوع الإجازة</option>
          <!-- عدّل الأنواع كما تريد -->
          <option>سنوية</option>
          <option>مرضية</option>
          <option>اضطرارية</option>
          <option>بدون راتب</option>
          <option>أخرى</option>
        </select>
      </div>

      <div class="row">
        <div class="field">
          <label for="from_txt">تاريخ البدء <span class="req">*</span></label>
          <div class="dfield">
            <input class="txt" id="from_txt" type="text" inputmode="numeric" autocomplete="off"
                   maxlength="10" placeholder="dd/mm/yyyy" dir="ltr" lang="en">
            <span class="cal">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M3 10h18M8 2.5v4M16 2.5v4"/></svg>
              <input class="native" id="from" type="date" tabindex="-1" aria-label="اختيار تاريخ البدء من التقويم">
            </span>
          </div>
        </div>
        <div class="field">
          <label for="to_txt">تاريخ الانتهاء <span class="req">*</span></label>
          <div class="dfield">
            <input class="txt" id="to_txt" type="text" inputmode="numeric" autocomplete="off"
                   maxlength="10" placeholder="dd/mm/yyyy" dir="ltr" lang="en">
            <span class="cal">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M3 10h18M8 2.5v4M16 2.5v4"/></svg>
              <input class="native" id="to" type="date" tabindex="-1" aria-label="اختيار تاريخ الانتهاء من التقويم">
            </span>
          </div>
        </div>
      </div>

      <div class="days" id="days">عدد أيام الإجازة سيظهر هنا بعد اختيار التاريخين</div>

      <div class="field">
        <label for="reason">سبب الإجازة</label>
        <textarea id="reason" placeholder="اكتب السبب باختصار"></textarea>
      </div>

      <button class="primary" id="btn" type="button">إرسال الطلب</button>
    </form>

    <div id="done">
      <div class="tick">✓</div>
      <h2>تم إرسال طلبك</h2>
      <div>رقم طلبك: <span class="num" id="num"></span></div>
      <p style="color:var(--muted)" id="mgrline">احتفظ بالرقم لمراجعة الإدارة.</p>
      <a id="waBtn" class="link-btn" target="_blank" rel="noopener"
         style="display:none;text-decoration:none;background:#25d366;color:#fff;border-color:#25d366">
         إرسال الطلب إلى المسؤول عبر واتساب</a>
      <br>
      <button class="link-btn" id="again" type="button">تقديم طلب جديد</button>
    </div>
  </div>
</main>

<script src="config.js"></script>
<script>
  const $ = id => document.getElementById(id);
  let employees = [];

  // تحميل أسماء الموظفين وأقسامهم من جدول الأرصدة
  api('getEmployees')
    .then(function (list) {
      employees = list;
      const dl = $('namesList');
      dl.innerHTML = '';
      list.forEach(function (e) {
        const o = document.createElement('option');
        o.value = e.name;
        dl.appendChild(o);
      });
      $('name').placeholder = list.length
        ? 'اكتب اسمك أو اختره من القائمة'
        : 'لا توجد أسماء مسجلة، راجع الإدارة';
    })
    .catch(function () {
      $('name').placeholder = 'تعذر تحميل الأسماء، حدّث الصفحة';
    });

  // عرض القسم تلقائياً عند اكتمال الاسم
  let balInfo = null, balName = '', balSeq = 0;

  function hideBalance() {
    balInfo = null; balName = '';
    $('bal').style.display = 'none'; $('balLoad').style.display = 'none';
  }

  // جلب رصيد الموظف من السيرفر عند اكتمال اسمه (مرة واحدة لكل اسم)
  function loadBalance(name) {
    if (name === balName) return;
    if (!name) { hideBalance(); updateDays(); return; }
    balName = name; balInfo = null;
    $('bal').style.display = 'none';
    $('balLoad').style.display = 'block';
    const seq = ++balSeq;                     // لتجاهل ردود قديمة إذا غيّر الموظف الاسم بسرعة
    api('getEmployeeBalance', { name: name })
      .then(function (b) {
        if (seq !== balSeq) return;
        $('balLoad').style.display = 'none';
        if (!b) { balName = ''; return; }
        balInfo = b;
        $('balTotal').textContent = b.category + ' يوم';
        $('balUsed').textContent = b.consumed + ' يوم';
        $('balLeft').textContent = b.remaining + ' يوم';
        $('balLeftBox').className = 'b' + (b.remaining < 0 ? ' neg' : '');
        $('bal').style.display = 'grid';
        updateDays();
      })
      .catch(function () {
        if (seq !== balSeq) return;
        $('balLoad').style.display = 'none'; balName = '';
      });
  }

  function updateDept() {
    const v = $('name').value.trim();
    const emp = employees.filter(function (e) { return e.name === v; })[0];
    $('dept').value = emp ? (emp.dept || '—') : '';
    loadBalance(emp ? emp.name : '');
  }
  $('name').addEventListener('input', updateDept);
  $('name').addEventListener('change', updateDept);

  const pad = n => String(n).padStart(2, '0');
  const now = new Date();
  const today = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate());  // تاريخ اليوم محلياً
  $('from').min = today; $('to').min = today;

  // تحويل الأرقام العربية والفارسية (٠١٢...) إلى أرقام إنجليزية
  function latin(str) {
    return String(str)
      .replace(/[\u0660-\u0669]/g, function (c) { return String(c.charCodeAt(0) - 0x0660); })
      .replace(/[\u06F0-\u06F9]/g, function (c) { return String(c.charCodeAt(0) - 0x06F0); });
  }
  // قناع الكتابة: 18102026 ← 18/10/2026
  function maskDate(raw) {
    const d = latin(raw).replace(/\D/g, '').slice(0, 8);
    if (d.length <= 2) return d;
    if (d.length <= 4) return d.slice(0, 2) + '/' + d.slice(2);
    return d.slice(0, 2) + '/' + d.slice(2, 4) + '/' + d.slice(4);
  }
  // dd/mm/yyyy ← yyyy-mm-dd (مع التحقق من صحة اليوم والشهر)
  function parseTxt(t) {
    const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(t);
    if (!m) return { iso: '', bad: false };
    const dd = +m[1], mm = +m[2], yy = +m[3];
    const dt = new Date(yy, mm - 1, dd);
    if (dt.getFullYear() === yy && dt.getMonth() === mm - 1 && dt.getDate() === dd) {
      return { iso: m[3] + '-' + m[2] + '-' + m[1], bad: false };
    }
    return { iso: '', bad: true };
  }
  // عند الكتابة اليدوية: نحدّث التاريخ الفعلي yyyy-mm-dd
  function onType(p) {
    const t = $(p + '_txt');
    t.value = maskDate(t.value);
    const r = parseTxt(t.value);
    $(p).value = r.iso;
    updateDays();
    if (r.bad) $('days').textContent = 'التاريخ غير صحيح، تحقق من اليوم والشهر';
  }
  // عند الاختيار من التقويم: نعرضه دائماً بصيغة dd/mm/yyyy
  function onPick(p) {
    const iso = $(p).value;
    $(p + '_txt').value = iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) + '/' + iso.slice(0, 4) : '';
    updateDays();
  }
  ['from', 'to'].forEach(function (p) {
    $(p + '_txt').addEventListener('input', function () { onType(p); });
    $(p).addEventListener('change', function () { onPick(p); });
  });

  function showError(t) { const e = $('err'); e.textContent = t; e.style.display = t ? 'block' : 'none'; }

  function updateDays() {
    const f = $('from').value, t = $('to').value;
    if (f) $('to').min = f;
    if (f && t) {
      const n = Math.round((new Date(t) - new Date(f)) / 86400000) + 1;
      if (n > 0) {
        let msg = 'مدة الإجازة: <strong>' + n + '</strong> ' + (n === 1 ? 'يوم' : 'أيام');
        if (balInfo && n > balInfo.remaining) {
          msg += '<br><span class="over">⚠️ المدة تتجاوز رصيدك المتبقي (' + balInfo.remaining + ' يوم)</span>';
        }
        $('days').innerHTML = msg;
      } else {
        $('days').textContent = 'تاريخ الانتهاء يجب أن يكون بعد تاريخ البدء';
      }
    } else {
      $('days').textContent = 'عدد أيام الإجازة سيظهر هنا بعد اختيار التاريخين';
    }
  }

  $('btn').addEventListener('click', function () {
    showError('');
    const data = {
      name: $('name').value.trim(), type: $('type').value,
      from: $('from').value, to: $('to').value, reason: $('reason').value.trim()
    };
    if (!data.name || !data.type || !data.from || !data.to) {
      return showError('يرجى تعبئة جميع الحقول المميزة بنجمة (*)');
    }
    if (!employees.some(function (e) { return e.name === data.name; })) {
      return showError('الاسم غير موجود في القائمة، اختره من الأسماء المقترحة');
    }
    if (data.from < today) return showError('تاريخ البدء لا يمكن أن يكون في الماضي');
    if (data.to < data.from) return showError('تاريخ الانتهاء يجب أن يكون بعد تاريخ البدء');

    $('btn').disabled = true; $('btn').textContent = 'جارٍ الإرسال...';
    api('submitRequest', data)
      .then(function (res) {
        $('form').style.display = 'none';
        $('num').textContent = res.id;
        $('mgrline').textContent = res.manager
          ? (res.notified ? 'تم إرسال طلبك إلى ' + res.manager + ' للموافقة.' : 'تم تسجيل طلبك، وسيراجعه ' + res.manager + '.')
          : 'تم تسجيل طلبك وستراجعه الإدارة.';
        $('done').style.display = 'block';
        var w = $('waBtn');
        if (res.wa) { w.href = res.wa; w.style.display = 'inline-block'; } else { w.style.display = 'none'; }
      })
      .catch(function (e) {
        $('btn').disabled = false; $('btn').textContent = 'إرسال الطلب';
        showError(e.message || 'حدث خطأ، حاول مرة أخرى');
      });
  });

  $('again').addEventListener('click', function () {
    $('form').reset(); $('dept').value = ''; $('from').value = ''; $('to').value = '';
    hideBalance(); updateDays();
    $('waBtn').style.display = 'none';
    $('btn').disabled = false; $('btn').textContent = 'إرسال الطلب';
    $('done').style.display = 'none'; $('form').style.display = 'block';
  });
</script>
</body>
</html>
