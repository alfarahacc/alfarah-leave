  .title { text-align: center; margin: 0 0 18px; }
  .title h1 { margin: 0; font-size: 1.6rem; font-weight: 800; line-height: 1.3; color: var(--gold); }
  .title p { margin: 2px 0 0; color: var(--muted); }
  .card { margin-bottom: 14px; }
  dl { margin: 0 0 14px; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  dt { color: var(--muted); flex: 0 0 auto; }
  dd { margin: 0; font-weight: 600; text-align: left; }
  .warn {
    background: rgba(179,38,30,.1); color: var(--error); border: 1px solid var(--error);
    border-radius: 10px; padding: 10px 12px; margin-bottom: 14px; font-weight: 600;
  }
  .btn {
    width: 100%; font: inherit; font-weight: 800; font-size: 1.15rem; cursor: pointer;
    border-radius: 12px; padding: 14px; margin-top: 10px; border: 2px solid transparent;
    display: block; text-align: center; text-decoration: none;
  }
  .btn.ok { background: var(--gold-dark); color: #fff; }
  .btn.no { background: transparent; color: var(--error); border-color: var(--error); }
  .btn.ghost { background: transparent; color: var(--muted); border-color: var(--line); }
  .btn:disabled { opacity: .6; cursor: wait; }
  .btn:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .center { text-align: center; }
  .big { font-size: 1.2rem; font-weight: 800; }
  .tick { font-size: 2.4rem; color: var(--gold); }
  .err { color: var(--error); font-weight: 600; margin-top: 10px; }
  .pw {
    width: 100%; font: inherit; color: var(--ink); background: rgba(255,255,255,.6);
    border: 1.5px solid var(--line); border-radius: 10px; padding: 13px 12px;
    text-align: center; letter-spacing: 2px; margin-top: 6px;
  }
  .pw:focus { outline: 3px solid var(--gold); outline-offset: 1px; border-color: var(--gold-dark); }
  .showpw {
    display: inline-flex; align-items: center; gap: 8px; margin-top: 10px;
    color: var(--muted); font-size: .95rem; cursor: pointer; user-select: none;
  }
  .showpw input { width: 18px; height: 18px; accent-color: var(--gold-dark); cursor: pointer; }
  @media (max-width: 480px) { .sheet { padding: 26% 7% 16%; } .title h1 { font-size: 1.35rem; } }
</style>
</head>
<body>
<main class="sheet">
  <div class="title">
    <h1>قرار طلب إجازة</h1>
    <p>مجمع الفرح السكني</p>
  </div>
  <div class="center" id="login">
    <p class="big" style="margin:0 0 6px">🔒 أدخل كلمة المرور للمتابعة</p>
    <input class="pw" id="pw" type="password" autocomplete="current-password" placeholder="كلمة المرور">
    <label class="showpw"><input type="checkbox" id="showPw"> إظهار كلمة المرور</label>
    <button class="btn ok" id="enter" type="button">دخول</button>
    <div class="err" id="loginErr"></div>
  </div>

  <div class="center card" id="fatal" style="display:none"></div>

  <div class="card" id="box" style="display:none">
    <dl id="info"></dl>
    <div class="warn" id="warn" style="display:none"></div>

    <div id="actions">
      <button class="btn ok" id="approve" type="button">موافقة</button>
      <button class="btn no" id="reject" type="button">عدم موافقة</button>
    </div>

    <div id="confirm" style="display:none">
      <p class="center big" id="confirmText"></p>
      <button class="btn ok" id="yes" type="button">تأكيد القرار</button>
      <button class="btn ghost" id="back" type="button">رجوع</button>
      <div class="err" id="err"></div>
    </div>

    <div class="center" id="result" style="display:none"></div>
  </div>
</main>

<script src="config.js"></script>
<script>
  // الرمز ونوع القرار المسبق يُقرآن من رابط الصفحة: approve.html?t=الرمز&d=approve|reject
  const _q = new URLSearchParams(location.search);
  const _t = _q.get('t') || '';
  const _d = _q.get('d');
  const TOKEN = /^[A-Za-z0-9-]{20,60}$/.test(_t) ? _t : '';
  const PRESET = (_d === 'approve' || _d === 'reject') ? _d : '';

  const $ = id => document.getElementById(id);
  let choice = null;
  let PASSWORD = '';   // تُحفظ في الذاكرة فقط وتُرسل للسيرفر للتحقق عند كل عملية

  function show(id, on) { $(id).style.display = on ? 'block' : 'none'; }

  function fatal(msg) {
    show('login', false); show('box', false);
    $('fatal').textContent = msg; show('fatal', true);
  }

  // ---------- الدخول بكلمة المرور ----------
  function enter() {
    const pw = $('pw').value;
    if (!pw) { $('loginErr').textContent = 'اكتب كلمة المرور'; return; }
    $('enter').disabled = true; $('enter').textContent = 'جارٍ التحقق...';
    $('loginErr').textContent = '';
    api('getApprovalInfo', { token: TOKEN, password: pw })
      .then(function (info) {
        PASSWORD = pw; $('pw').value = ''; $('pw').type = 'password'; $('showPw').checked = false;
        render(info);
      })
      .catch(function (e) {
        $('enter').disabled = false; $('enter').textContent = 'دخول';
        $('loginErr').textContent = (e && e.message) || 'حدث خطأ، حاول مرة أخرى';
      });
  }
  $('enter').addEventListener('click', enter);
  $('showPw').addEventListener('change', function () {
    $('pw').type = this.checked ? 'text' : 'password';
    $('pw').focus();
  });
  $('pw').addEventListener('keydown', function (ev) { if (ev.key === 'Enter') enter(); });

  // ---------- عرض الطلب ----------
  function addRow(label, value) {
    const row = document.createElement('div'); row.className = 'row';
    const dt = document.createElement('dt'); dt.textContent = label;
    const dd = document.createElement('dd'); dd.textContent = value;
    row.appendChild(dt); row.appendChild(dd);
    $('info').appendChild(row);
  }

  function showResult(ok, when) {
    show('actions', false); show('confirm', false);
    const res = $('result');
    res.innerHTML = '';
    const t = document.createElement('div'); t.className = 'tick'; t.textContent = ok ? '✓' : '✕';
    const m = document.createElement('div'); m.className = 'big';
    m.textContent = ok ? 'تمت الموافقة على الطلب' : 'تم تسجيل عدم الموافقة';
    res.appendChild(t); res.appendChild(m);
    if (when) {
      const w = document.createElement('div'); w.style.color = 'var(--muted)';
      w.textContent = 'بتاريخ ' + when; res.appendChild(w);
    }
    show('result', true);
  }

  function render(info) {
    if (!info) return fatal('تعذر قراءة بيانات الطلب، راجع الإدارة.');
    show('login', false);

    $('info').innerHTML = '';
    addRow('الموظف', info.name);
    addRow('القسم', info.dept);
    addRow('نوع الإجازة', info.type);
    addRow('من', info.from);
    addRow('إلى', info.to);
    addRow('المدة', info.days + (info.days === 1 ? ' يوم' : ' أيام'));
    if (info.remaining !== null && info.remaining !== undefined) {
      addRow('الرصيد الحالي', info.remaining + ' يوم (من ' + info.category + ' سنوياً)');
    }
    if (info.reason) addRow('السبب', info.reason);
    show('box', true);

    if (!info.pending) {
      showResult(info.approved, info.decidedAt);
      return;
    }

    if (!info.enough) {
      $('warn').textContent = '⚠️ تنبيه: رصيد الموظف الحالي أقل من المدة المطلوبة.';
      show('warn', true);
    }
    if (PRESET === 'approve' || PRESET === 'reject') choose(PRESET);
  }

  // ---------- القرار ----------
  function choose(c) {
    choice = c;
    $('confirmText').textContent =
      c === 'approve' ? 'تأكيد الموافقة على الطلب؟' : 'تأكيد عدم الموافقة على الطلب؟';
    $('err').textContent = '';
    show('actions', false); show('confirm', true);
  }

  $('approve').addEventListener('click', function () { choose('approve'); });
  $('reject').addEventListener('click', function () { choose('reject'); });
  $('back').addEventListener('click', function () { show('confirm', false); show('actions', true); });

  $('yes').addEventListener('click', function () {
    const btn = $('yes');
    btn.disabled = true; btn.textContent = 'جارٍ الحفظ...';
    $('err').textContent = '';
    api('decide', { token: TOKEN, choice: choice, password: PASSWORD })
      .then(function (res) {
        show('warn', false);
        showResult(res.approved, 'الآن');
      })
      .catch(function (err) {
        btn.disabled = false; btn.textContent = 'تأكيد القرار';
        $('err').textContent = (err && err.message) || 'حدث خطأ، حاول مرة أخرى';
      });
  });

  // ---------- البداية ----------
  if (!TOKEN) {
    fatal('الرابط غير صالح.');
  } else {
    $('pw').focus();
  }
</script>
</body>
</html>
